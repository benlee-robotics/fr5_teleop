name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/benlee-robotics/fr5_teleop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches teleop.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' teleop/__init__.py)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ ${version}" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Test inside the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
