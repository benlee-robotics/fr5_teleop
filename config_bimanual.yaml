# Bimanual (dual-arm) configuration for FAIRINO FR5.
# Hardware mode requires dry_run: false and --confirm-hardware explicitly.

runtime:
  dry_run: true
  log_level: INFO
  status_hz: 10

server:
  host: 0.0.0.0
  port: 8443
  web_dir: web
  max_ws_message_bytes: 4096
  allowed_origins: []

tls:
  enabled: true
  cert_path: certs/cert.pem
  key_path: certs/key.pem

robot:
  # Bundled SDK 2.2.8 for robot firmware v3.9.8; both arms use it unless
  # an arm sets its own sdk_path.
  sdk_path: fairino-python-sdk-2.2.8_robot_v3.9.8/linux
  exaxis_default: [0.0, 0.0, 0.0, 0.0]
  arms:
    left:
      ip: 192.168.58.2  # Left arm (Robot v3.9.8)
      workspace:
        x: [-600.0, 600.0]
        y: [-600.0, 600.0]
        z: [-500.0, 700.0]
    right:
      ip: 192.168.59.3  # Right arm (Robot v3.9.8)
      workspace:
        x: [-100.0, 500.0]
        y: [-360.0, -80.0]
        z: [-160.0, 420.0]

timing:
  servo_period_s: 0.008
  servo_transition_window_s: 1.0
  servo_transition_limit: 4
  pose_timeout_s: 0.500
  worker_watchdog_s: 3.0
  worker_startup_timeout_s: 30.0
  graceful_shutdown_s: 1.0

motion:
  position_scale: 900.0
  ema_alpha: 0.2
  max_velocity_mm_s: 150.0
  max_step_mm: 2
  # Global fallback workspace if per-arm workspace is not specified.
  workspace:
    x: [-600.0, 600.0]
    y: [-600.0, 600.0]
    z: [-500.0, 700.0]

# Global gripper defaults. Per-arm overrides can be set in robot.arms.<hand>.gripper.
gripper:
  enabled: false
  index: 1
  activate_on_start: false
  initially_closed: false
  open_position: 0
  closed_position: 100
  velocity: 50
  force: 50
  command_max_time_ms: 3000
  action_timeout_s: 5.0
  poll_period_s: 0.050

# Disabled here: not yet per-arm configurable. Roll/pitch/yaw were verified
# on a single v3.9.8 arm (see config.yaml); check both arms before enabling.
orientation:
  enabled: false
  scale: 1.0
  ema_alpha: 0.2
  max_angular_velocity_deg_s: 15.0
  max_step_deg: 1.0
  max_deviation_deg: 20.0

# Raw demonstration recording. Observation-only; control it from /monitor.
recording:
  enabled: false
  root_dir: recordings
  # RealSense cameras, each in its own Camera process. Requires
  # requirements-camera.txt (in the Docker image) and the host udev rules
  # (sudo bash scripts/install_realsense_udev.sh). Recording refuses to start
  # while any enabled camera is not streaming. With more than one enabled
  # RealSense every camera needs its serial (quote it: "123456789012").
  # source: fake gives synthetic frames for dry-run tests.
  # name becomes the dataset key observation.images.<name>.
  cameras:
    - name: wrist       # wrist D435i
      enabled: false
      source: realsense
      serial: null
      width: 640
      height: 480
      fps: 30
      depth: false      # 16-bit depth aligned to color, FFV1 lossless
    - name: top         # fixed top-view D435
      enabled: false
      source: realsense
      serial: null
      width: 640
      height: 480
      fps: 30
      depth: false
